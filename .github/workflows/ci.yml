name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            gpt-site/package-lock.json
      - run: npm ci
      - run: npm ci
        working-directory: gpt-site
      # Typecheck and tests of the plugin, then of the Site.
      - run: npm run check
      - run: npm run build
        working-directory: gpt-site
