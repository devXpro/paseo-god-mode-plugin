name: Release

# `npm version X.Y.Z && git push --follow-tags` pushes the tag vX.Y.Z that lands here.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            gpt-site/package-lock.json
      - name: The tag is the version in package.json
        run: |
          version="$(node -p 'require("./package.json").version')"
          [ "${GITHUB_REF_NAME}" = "v${version}" ] || { echo "Tag ${GITHUB_REF_NAME} does not match package.json ${version}."; exit 1; }
      - run: npm ci
      - run: npm ci
        working-directory: gpt-site
      - run: npm run check
      - run: npm run build
        working-directory: gpt-site
      - name: Release notes from CHANGELOG.md
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" 'index($0, "## [" v "]") == 1 { found = 1; next } found && /^## \[/ { exit } found { print }' CHANGELOG.md > notes.md
          [ -s notes.md ] || { echo "CHANGELOG.md has no section for ${version}."; exit 1; }
      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=""
          case "${GITHUB_REF_NAME}" in *-*) prerelease="--prerelease" ;; esac
          gh release create "${GITHUB_REF_NAME}" --verify-tag --title "God Mode ${GITHUB_REF_NAME#v}" --notes-file notes.md ${prerelease}
