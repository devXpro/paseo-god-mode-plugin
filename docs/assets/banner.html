<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  :root {
    --accent: #ffb020;
    --accent-hot: #ff7a00;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1280px; height: 440px; background: #000; overflow: hidden; }
  body {
    position: relative;
    font-family: -apple-system, "SF Pro Display", "Inter", "Helvetica Neue", Arial, sans-serif;
    color: #fff;
  }

  /* Perspective floor: the agents' plane, fading into the dark. */
  .floor {
    position: absolute;
    left: -40%; right: -40%;
    top: 210px; height: 620px;
    background-image:
      linear-gradient(rgba(255,255,255,0.075) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,0.075) 1px, transparent 1px);
    background-size: 56px 56px;
    transform-origin: 50% 0;
    transform: perspective(520px) rotateX(64deg);
    -webkit-mask-image: linear-gradient(to bottom, transparent 0%, #000 14%, #000 40%, transparent 86%);
            mask-image: linear-gradient(to bottom, transparent 0%, #000 14%, #000 40%, transparent 86%);
  }
  .node {
    position: absolute;
    width: 10px; height: 10px; border-radius: 50%;
    background: var(--accent);
    box-shadow: 0 0 10px 3px rgba(255,176,32,0.75), 0 0 32px 8px rgba(255,122,0,0.35);
  }
  .node.dim { background: #3a2a10; box-shadow: none; }

  /* The voice: one glossy orb with its command waves. */
  .orb-wrap { position: absolute; left: 960px; top: 178px; }
  .ring {
    position: absolute; border-radius: 50%;
    border: 1px solid rgba(255,176,32,0.22);
    transform: translate(-50%, -50%);
  }
  .glow {
    position: absolute; width: 520px; height: 520px; border-radius: 50%;
    transform: translate(-50%, -50%);
    background: radial-gradient(circle, rgba(255,150,20,0.30) 0%, rgba(255,120,0,0.10) 35%, transparent 65%);
  }
  .orb {
    position: absolute; width: 196px; height: 196px; border-radius: 50%;
    transform: translate(-50%, -50%);
    background:
      radial-gradient(circle at 34% 28%, rgba(255,255,255,0.95) 0%, rgba(255,246,220,0.85) 6%, rgba(255,214,120,0.0) 22%),
      radial-gradient(circle at 50% 55%, #ffcf5a 0%, #ff9d14 34%, #c75a00 62%, #3d1600 88%, #120600 100%);
    box-shadow:
      inset -26px -34px 60px rgba(0,0,0,0.55),
      inset 10px 14px 30px rgba(255,240,200,0.25),
      0 0 60px 10px rgba(255,160,30,0.45),
      0 0 160px 40px rgba(255,110,0,0.20);
  }
  .orb-reflection {
    position: absolute; width: 150px; height: 26px; border-radius: 50%;
    transform: translate(-50%, 0);
    top: 150px;
    background: radial-gradient(ellipse, rgba(255,160,30,0.35) 0%, transparent 70%);
    filter: blur(6px);
  }

  /* Type. */
  .copy { position: absolute; left: 84px; top: 74px; width: 700px; }
  .label {
    font-size: 15px; font-weight: 600; letter-spacing: 0.34em;
    color: #7d7d7d; text-transform: uppercase;
  }
  .label b { color: var(--accent); font-weight: 600; }
  h1 {
    margin-top: 14px;
    font-size: 112px; line-height: 0.92; font-weight: 800; letter-spacing: -0.035em;
    background: linear-gradient(180deg, #ffffff 0%, #ffffff 55%, #b8b8b8 100%);
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .tagline {
    margin-top: 22px;
    font-size: 27px; font-weight: 500; letter-spacing: -0.01em; color: #c9c9c9;
  }
  .chip {
    margin-top: 30px;
    display: inline-flex; align-items: center; gap: 14px;
    padding: 12px 20px 12px 16px;
    border-radius: 999px;
    background: rgba(18,18,18,0.92);
    border: 1px solid #2b2b2b;
    box-shadow: 0 10px 40px rgba(0,0,0,0.6);
  }
  .wave { display: flex; align-items: center; gap: 3px; height: 22px; }
  .wave i { display: block; width: 3px; border-radius: 2px; background: var(--accent); }
  .chip span { font-size: 18px; color: #e8e8e8; letter-spacing: -0.005em; }
  .chip em { font-style: normal; color: #6f6f6f; margin-left: 6px; font-size: 15px; }

  .agents { position: absolute; left: 0; top: 0; }
  .agents .beams line { stroke: rgba(255,176,32,0.20); stroke-width: 1; }
  .agents .lit { fill: var(--accent); }
  .agents .dim { fill: #4a3510; }
  .agents .labels text {
    font-family: "SF Mono", Menlo, monospace; font-size: 12px; letter-spacing: 0.04em;
    fill: #666; text-anchor: middle;
  }
  .vignette {
    position: absolute; inset: 0; pointer-events: none;
    background: radial-gradient(ellipse at 60% 40%, transparent 55%, rgba(0,0,0,0.75) 100%);
  }
</style>
</head>
<body>
  <div class="floor">
  </div>

  <svg class="agents" width="1280" height="440" viewBox="0 0 1280 440">
    <defs>
      <filter id="glow" x="-200%" y="-400%" width="500%" height="900%">
        <feGaussianBlur stdDeviation="4" result="b" />
        <feMerge><feMergeNode in="b" /><feMergeNode in="b" /><feMergeNode in="SourceGraphic" /></feMerge>
      </filter>
    </defs>
    <g class="beams">
      <line x1="960" y1="262" x2="742" y2="324" />
      <line x1="960" y1="262" x2="858" y2="392" />
      <line x1="960" y1="262" x2="1092" y2="394" />
      <line x1="960" y1="262" x2="1198" y2="320" />
      <line x1="960" y1="262" x2="985" y2="418" />
    </g>
    <g filter="url(#glow)">
      <ellipse cx="742" cy="324" rx="7" ry="3" class="lit" />
      <ellipse cx="858" cy="392" rx="7" ry="3" class="lit" />
      <ellipse cx="1092" cy="394" rx="7" ry="3" class="lit" />
      <ellipse cx="1198" cy="320" rx="7" ry="3" class="lit" />
      <ellipse cx="985" cy="418" rx="7" ry="3" class="lit" />
      <ellipse cx="650" cy="404" rx="5" ry="2" class="dim" />
      <ellipse cx="1252" cy="410" rx="5" ry="2" class="dim" />
    </g>
    <g class="labels">
      <text x="742" y="346">web-app</text>
      <text x="858" y="414">api</text>
      <text x="1092" y="416">mobile</text>
      <text x="1198" y="342">infra</text>
    </g>
  </svg>

  <div class="orb-wrap">
    <div class="glow"></div>
    <div class="ring" style="width: 268px; height: 268px;"></div>
    <div class="ring" style="width: 352px; height: 352px; border-color: rgba(255,176,32,0.14);"></div>
    <div class="ring" style="width: 448px; height: 448px; border-color: rgba(255,176,32,0.08);"></div>
    <div class="orb"></div>
    <div class="orb-reflection"></div>
  </div>

  <div class="copy">
    <div class="label">Paseo plugin <b>·</b> for ChatGPT</div>
    <h1>God Mode</h1>
    <div class="tagline">Talk to ChatGPT. Every Paseo agent obeys.</div>
    <div class="chip">
      <div class="wave">
        <i style="height: 8px"></i><i style="height: 16px"></i><i style="height: 22px"></i><i style="height: 12px"></i>
        <i style="height: 18px"></i><i style="height: 9px"></i><i style="height: 20px"></i><i style="height: 13px"></i>
        <i style="height: 6px"></i>
      </div>
      <span>“Fix the flaky test, then ship it.”<em>— by voice, from anywhere</em></span>
    </div>
  </div>

  <div class="vignette"></div>
</body>
</html>
